<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a3165" />
    <meta name="description" content="HC Wettern – matcher, tabell, statistik, truppen och nyheter från föreningen." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/crest.png" />
    <link rel="apple-touch-icon" href="./icons/icon-512.png" />
    <title>HC Wettern</title>
    <script>
      // Sätt tema innan första renderingen så att mörkt läge inte blinkar vitt
      try {
        var c = localStorage.getItem('hcw-theme');
        var d = c === 'dark' || (c !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
