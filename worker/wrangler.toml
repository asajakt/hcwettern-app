# Cloudflare Worker för push-prenumerationer och liveställning.
# Driftsätts med: npm run api:deploy   (se docs/PUBLICERING.md)
name = "hcwettern-api"
main = "index.ts"
compatibility_date = "2025-07-01"

[[kv_namespaces]]
binding = "KV"
id = "ca3617a56dc3475994662dda88a404bc"

[vars]
# Publik VAPID-nyckel (från: npx web-push generate-vapid-keys). Den privata nyckeln ligger bara i GitHub Secrets.
VAPID_PUBLIC_KEY = "BEp05w8-vptGca43XD6IhfqpuJSZ0ZOeAMe7UrL_LwgfqIttvbUiROyzytrVfsQEdLOeEOezS3HQVtkGvdfXnN0"
# Vilka webbadresser som får anropa API:t, t.ex. "https://app.hcwettern.se,http://localhost:5173"
ALLOWED_ORIGINS = "https://asajakt.github.io"
# Används av tidsstyrningen (scheduler.ts)
GITHUB_REPO = "asajakt/hcwettern-app"
APP_URL = "https://asajakt.github.io/hcwettern-app/"

# Var 5:e minut: starta matchbevakning vid behov. Varje timme: uppdatera tabell och statistik.
[triggers]
crons = ["*/5 * * * *", "7 * * * *"]

# Hemliga: npx wrangler secret put ADMIN_TOKEN  och  npx wrangler secret put GITHUB_TOKEN
