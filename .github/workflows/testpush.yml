# Skickar en testnotis till alla som slagit på notiser för mål.
name: Testnotis

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run push:test
        env:
          HCW_API_URL: ${{ vars.HCW_API_URL }}
          APP_URL: ${{ vars.APP_URL }}
          HCW_ADMIN_TOKEN: ${{ secrets.HCW_ADMIN_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
