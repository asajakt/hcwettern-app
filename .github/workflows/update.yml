# Hämtar data från swehockey och svenskalag, sparar den i repot och publicerar appen på GitHub Pages.
# Körs varje timme, vid push till main, manuellt och efter varje bevakad match (från live.yml).
name: Uppdatera och publicera

on:
  push:
    branches: [main]
    paths-ignore: ['public/data/**', 'docs/**', '*.md']
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      HCW_API_URL: ${{ vars.HCW_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Hämta data
        run: npm run scrape
      - name: Spara data i repot
        run: |
          git config user.name "hcw-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || (git commit -m "Uppdaterad data" && git pull --rebase && git push)
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
